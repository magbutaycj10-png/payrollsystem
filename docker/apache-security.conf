# Apache settings for the public server (copied in by the Dockerfile).

# Do not tell the world which Apache / OS version is running
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    # no folder listings
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Code-only folders: pages load them from disk, nobody requests them over the web
<DirectoryMatch "^/var/www/html/(.+/)?(includes|sql|tools)(/|$)">
    Require all denied
</DirectoryMatch>

# Files that are never pages: notes, SQL, settings, logs, keys, scripts
<FilesMatch "\.(md|sql|ini|log|pem|key|bak|sh|bat|example|json|py)$">
    Require all denied
</FilesMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# The same protective headers the app sends, also on images, CSS and JS
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"
Header always unset X-Powered-By
