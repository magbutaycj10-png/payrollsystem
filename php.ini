; ============================================================
;  php.ini for L&N Pharmacy Payroll System
;  Copy this file into:  C:\PayrollApp2\php\php.ini
; ============================================================

error_reporting  = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors   = On
log_errors       = On
error_log        = ../payroll_error.log

max_execution_time   = 60
memory_limit         = 128M
post_max_size        = 20M
upload_max_filesize  = 20M

session.gc_maxlifetime  = 3600
session.cookie_httponly = 1

; ── Required extensions - NO semicolons, already enabled ──
extension=pdo_mysql
extension=openssl
extension=mbstring
extension=curl

; extension_dir = "ext"
