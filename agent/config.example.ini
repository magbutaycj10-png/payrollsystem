; config.example.ini -> copy to config.ini on the client PC and fill in.
; config.ini is gitignored: it holds this PC's API key.

; =====================================================================
;  biometric_agent configuration
;
;  This file sits NEXT TO biometric_agent.exe. It is read fresh on every
;  poll, so you can edit it while the agent is running - no restart.
;
;  The agent writes back to this file once, to remember the baud rate and
;  frame format it negotiated with the terminal.
; =====================================================================

[device]
; Free-text name for this terminal. Shows up in attendance_logs.device_id
; and in biometric_agent_state, so you can see which PC it is plugged into.
device_id = EPH-A6-01

serial_enabled = true

; USB VID:PID of the CH340/CH341/CH9102 bridge chips. The agent matches on
; these, so Windows can assign COM3, COM4 or COM17 - it makes no difference.
vid_pid_filter = 1A86:7523,1A86:5523,1A86:7522,1A86:55D4

; Leave blank for auto-detect. Set to e.g. COM4 only to force one port.
port_override =

; Leave BOTH blank on first run. The agent sweeps 115200/57600/38400/19200/
; 9600 against raw and tcp framing, then writes the winning pair back here.
baud =
framing =

; How often to poll the device buffer, in seconds.
poll_seconds = 20
serial_timeout = 2.0


[network]
; Use this instead of serial if the terminal has ethernet/wifi. This is the
; best-documented ZK path and needs pyzk installed.
enabled = false
ip =
port = 4370
timeout = 5
force_udp = false


[watch]
; Parses the terminal's own "Individual Report_*.XLS" USB exports.
; This path needs no driver and no COM port - it always works.
enabled = true

; Scan every removable drive root (D: onward) for new exports.
drives_auto = true

; Extra folders to scan, comma separated.
folders =

patterns = Individual Report*.XLS,Individual Report*.xls,Attendance Summary*.XLS,Attendance Summary*.xls,*AttLog*.dat
archive = true


[sync]
; api  - POST to the Render endpoint (RECOMMENDED: the PC only holds a
;        revocable per-device key, never the database password)
; db   - write straight into Aiven from this PC
; both - try both; the UNIQUE key makes a double write harmless
mode = api

api_url = https://YOUR-APP.onrender.com/api/biometric-ingest.php
api_key = <the key printed by tools/issue-api-key.php>

batch_size = 200

; Ignore punches older than this. The device buffer holds months of history
; and there is no point re-uploading all of it on every poll.
lookback_days = 45
http_timeout = 30


[database]
; Only used when sync.mode is db or both.
;
; WARNING: anything in this section ends up readable on the client PC.
; Do not put the admin database account here. Create a restricted Aiven user
; with INSERT-only rights on attendance_logs and biometric_agent_state.
driver = mysql
host =
port = 3306
name = defaultdb
user =
password =
ssl_ca = ca.pem


[agent]
log_level = INFO
log_dir =
state_file = agent_state.json
single_instance = true
